name: Accessibility (Pa11y CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  a11y-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run jest-axe smoke tests
        run: npm run test:a11y --silent

      - name: Build app
        run: npm run build

      - name: Ensure reports dir
        run: mkdir -p pa11y-reports

      - name: Start static server
        run: npx serve -s build -l 3000 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Server is up"; exit 0; fi; sleep 1; done; exit 1

      - name: Run Pa11y CI (JSON report)
        run: npx pa11y-ci --config pa11y.config.json --reporter json > pa11y-reports/report.json

      - name: Upload Pa11y reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-reports
          path: |
            pa11y-reports/
            pa11y.config.json