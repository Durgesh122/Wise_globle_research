name: Accessibility CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint (includes jsx-a11y)
        run: npm run lint --silent || true
      - name: Run jest-axe smoke test
        run: npm run test:a11y --silent
      - name: Build app
        run: npm run build
      - name: Prepare reports dir
        run: mkdir -p pa11y-reports
      - name: Start static server
        run: npx serve -s build -l 5000 &
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000 > /dev/null; then
              echo "Server is up"; exit 0; fi; sleep 1; done; exit 1
      - name: Run Pa11y CI
        run: npx pa11y-ci --config pa11y.config.json --reporter json > pa11y-reports/report.json || true
      - name: Upload Pa11y reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-reports
          path: |
            pa11y-reports/
            pa11y.config.json
