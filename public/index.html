    <!-- Google tag (gtag.js) - load script async, defer config and conversion until after load to avoid blocking LCP/TBT -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1137180109"></script>
    <script>
      // Initialize dataLayer and a lightweight gtag shim immediately so we don't depend on window 'load'.
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }

      function initAnalytics() {
        try {
          gtag('js', new Date());
          gtag('config', 'AW-1137180109');
        } catch (e) { /* no-op */ }
        // Fire conversion later so it doesn't compete with LCP work
        setTimeout(function(){
          try { gtag('event', 'conversion', { send_to: 'AW-1137180109/aoxKCJGg_4EbEIqvo6pA' }); } catch (e) {}
        }, 2000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAnalytics);
      } else {
        initAnalytics();
      }
    </script>

    <script>
      // Early apply of saved accessibility settings before React mounts to avoid flashes
      (function(){
        try {
          var raw = localStorage.getItem('a11ySettings');
          if (!raw) return;
          var s = JSON.parse(raw);
          var root = document.documentElement;
          // font scale
          var scale = Math.max(0.9, Math.min(1.8, parseFloat((s.fontScale||1)*1)));
          root.style.fontSize = (scale * 100) + '%';
          // boolean data attrs
          function setAttr(name, val){ if (val) root.setAttribute(name, 'true'); }
          setAttr('data-high-contrast', !!s.highContrast);
          setAttr('data-reduce-motion', !!s.reduceMotion);
          setAttr('data-highlight-links', !!s.highlightLinks);
          setAttr('data-readable-font', !!s.readableFont);
          setAttr('data-grayscale', !!s.grayscale);
          setAttr('data-invert', !!s.invert);
          if (s.lineHeight === 'relaxed') root.setAttribute('data-line-height', 'relaxed');
        } catch(e) { /* ignore */ }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
